<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'" />
    <title>Wallet simulation — demo only</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #101010; color: #f5f1e9; font: 15px/1.6 system-ui, sans-serif; }
      main { width: 100%; max-width: 360px; }
      .badge { display: inline-block; padding: 4px 10px; border: 1px solid #3c6670; border-radius: 20px; color: #80d6e8; font-size: 12px; font-weight: 700; letter-spacing: .08em; }
      h1 { margin: 20px 0 8px; font-size: 28px; line-height: 1.2; }
      p { color: #010000; margin: 0 0 24px; }
      code { color: #f5f1e9; }
      label { display: block; margin-bottom: 8px; font-weight: 600; }
      input { width: 100%; padding: 12px; border: 1px solid #484848; border-radius: 10px; background: #191919; color: #f5f1e9; font: inherit; }
      input:focus { outline: 2px solid #80d6e8; outline-offset: 2px; }
      button { width: 100%; margin-top: 16px; padding: 12px; border: 0; border-radius: 10px; background: #80d6e8; color: #101010; font: inherit; font-weight: 700; cursor: pointer; }
      .cancel { margin-top: 8px; background: transparent; color: #b4b0a8; }
      .note { margin-top: 20px; font-size: 12px; }
    </style>
    <script src="/wallet-demo.js" defer></script>
  </head>
  <body>
    <main>
      <span class="badge">SIMULATION · DEMO ONLY</span>
      <h1>Wallet connection demo</h1>
      <p>This is a generic demo, not a wallet extension. Never enter a real wallet password.</p>
      <form id="demo-form" autocomplete="off">
        <label for="dummy-value">Dummy password</label>
        <p id="dummy-help">Type <code>demo-password</code> to finish and close this window.</p>
        <input id="dummy-value" type="text" pattern="demo-password" required autocomplete="off" spellcheck="false" autocapitalize="none" aria-describedby="dummy-help" placeholder="demo-password" data-1p-ignore data-lpignore="true" />
        <button type="submit">Finish simulation</button>
      </form>
      <button class="cancel" id="cancel" type="button">Cancel</button>
      <p class="note" role="status" id="status">Nothing entered here is saved or sent. No wallet is connected.</p>
    </main>
  </body>
</html>
